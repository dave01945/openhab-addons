addon.octopusapi.description = This is the binding for Octopus API.

# thing types

thing-type.octopusapi.octopus.label = Octopus API Binding Thing
thing-type.octopusapi.octopus.description = Octopus API Binding for consumption and agile rates

# thing types config

thing-type.config.octopusapi.settings.accountNumber.label = Account Number
thing-type.config.octopusapi.settings.accountNumber.description = Your Octopus Energy account number (optional for public Agile forecast only).
thing-type.config.octopusapi.settings.agileExportProductCode.label = Agile Export Product Code
thing-type.config.octopusapi.settings.agileExportProductCode.description = Optional Agile OUTGOING (export) product code (for example AGILE-OUTGOING-24-10-01). Leave blank to auto-select latest active Agile OUTGOING product.
thing-type.config.octopusapi.settings.agileProductCode.label = Agile Product Code
thing-type.config.octopusapi.settings.agileProductCode.description = Optional Agile import product code (for example AGILE-24-10-01). Leave blank to auto-select latest active Agile import product.
thing-type.config.octopusapi.settings.agileRegion.label = Agile Region
thing-type.config.octopusapi.settings.agileRegion.description = Region code for the Agile tariff endpoint. Leave blank to auto-detect from your account tariff (requires API Key and Account Number).
thing-type.config.octopusapi.settings.apiKey.label = API Key
thing-type.config.octopusapi.settings.apiKey.description = API Key for authenticated Octopus GraphQL account data (optional for public Agile forecast only).
thing-type.config.octopusapi.settings.liveRefreshInterval.label = Live Data Refresh Interval
thing-type.config.octopusapi.settings.liveRefreshInterval.description = Time between refreshing live consumption data in seconds (requires Home Mini). Minimum 60 seconds, maximum 300 seconds. Set higher if experiencing rate limiting.
thing-type.config.octopusapi.settings.refreshInterval.label = Refresh Interval
thing-type.config.octopusapi.settings.refreshInterval.description = Time between refreshing the data in hours (minimum 1 hour, maximum 48 hours).

